<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>splat-viewer</title>
<style>
  /* 纯展示页：整页只有模型本身。白底、无网格、无任何常驻 UI。 */
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: #ffffff;
  }
  #stage {
    position: absolute; inset: 0;
    overflow: hidden;               /* 位置偏移后不许溢出画面 */
    background: #ffffff;
  }
  #stage .host {
    position: absolute; inset: 0;
  }

  /* 加载中给一个极淡的细环 —— 加载完立刻移除，最终状态是干干净净一张白底 */
  .spinner {
    position: absolute; left: 50%; top: 50%;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border: 2px solid rgba(0, 0, 0, .06);
    border-top-color: rgba(0, 0, 0, .22);
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 只有出错时才出现，正常看模型时页面上不该有任何文字 */
  .msg {
    position: absolute; left: 50%; bottom: 28px;
    transform: translateX(-50%);
    max-width: min(80vw, 720px);
    font: 12px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #9aa0a6; text-align: center; word-break: break-all;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "@mkkellogg/gaussian-splats-3d": "./vendor/gaussian-splats-3d.module.js"
  }
}
</script>
</head>
<body>

<div id="stage"></div>

<script type="module">
import {
  HOME_POS, createViewer, fitMesh, createPanController
} from './viewer-core.js';

/* ============================================================
 * 模型地址
 * 用相对路径，本地 serve.py 与将来的静态托管（git / Pages）都能直接用。
 * 若模型放在别的层级，只改这一行即可。
 * ============================================================ */
const MODEL_BASE = 'models/';

/* 取景常量统一放在 viewer-core.js，与主页面共用，这里不再各写一份。 */

/* ---------- 参数 ----------
 * ?model=文件.spz      必填
 * ?yaw=90              可选，绕 Y 轴补转角度（默认 0）
 * ?up=0,-1,0           可选，相机上方向（默认 Y 向下，3DGS 常规）
 *                       个别模型朝向不对时可试 0,0,1 或 0,1,0
 * ?bg=ffffff           可选，底色（6 位十六进制，不带 #）
 * ?cam=x,y,z           可选，相机位置（决定旋转角度和缩放）
 * ?pan=12,-8           可选，画面偏移，按画面的百分比（正右、正下为正）
 *
 * 壁纸和网格不从链接传 —— 壁纸是本地文件塞不进 URL，展示页始终无网格。
 */
const qs = new URLSearchParams(location.search);
const modelName = (qs.get('model') || '').trim();
const yawDeg = Number.isFinite(parseFloat(qs.get('yaw'))) ? parseFloat(qs.get('yaw')) : 0;
const camUp = (qs.get('up') || '0,-1,0').split(',').map(Number);

/* 三坐标解析：格式不对就退回默认值，不让坏参数把页面搞崩 */
function parseVec3(s, fallback) {
  if (!s) return fallback;
  const a = s.split(',').map(Number);
  return (a.length === 3 && a.every(Number.isFinite)) ? a : fallback;
}

/* 两坐标（百分比）解析，用于画面偏移 */
function parseVec2(s, fallback) {
  if (!s) return fallback;
  const a = s.split(',').map(Number);
  return (a.length === 2 && a.every(Number.isFinite)) ? a : fallback;
}

const bgHex   = /^[0-9a-fA-F]{6}$/.test(qs.get('bg') || '') ? '#' + qs.get('bg') : null;
const homePos = parseVec3(qs.get('cam'), HOME_POS);
const panPct  = parseVec2(qs.get('pan'), [0, 0]);

const stageEl = document.getElementById('stage');

/* 画面内平移：与主页面共用同一份实现，改这里等于两边一起改。
   必须放在 stageEl 取到之后 —— 控制器要用它绑事件。 */
let viewerRef = null;
const pan = createPanController(stageEl, () => viewerRef);

/* 链接里带底色就先用，闪一下白底的情况也就没有了 */
if (bgHex) {
  document.documentElement.style.backgroundColor = bgHex;
  document.body.style.backgroundColor = bgHex;
  stageEl.style.backgroundColor = bgHex;
}

function showMsg(text) {
  const d = document.createElement('div');
  d.className = 'msg';
  d.textContent = text;
  stageEl.appendChild(d);
}





async function boot() {
  document.title = modelName;

  const spin = document.createElement('div');
  spin.className = 'spinner';
  stageEl.appendChild(spin);

  const host = document.createElement('div');
  host.className = 'host';
  stageEl.appendChild(host);

  try {
    const viewer = createViewer(host, { cameraUp: camUp, position: homePos });

    await viewer.addSplatScene(MODEL_BASE + encodeURIComponent(modelName), {
      splatAlphaRemovalThreshold: 5,
      showLoadingUI: false,
    });

    viewer.start();
    viewerRef = viewer;
    fitMesh(viewer.getSplatMesh(), yawDeg);

    // 还原主页面摆好的位置（URL 里是画面百分比）
    pan.setFromPercent(panPct[0], panPct[1]);
    // 库在初始化/重排时会重算投影矩阵，补几次覆盖启动阶段的抖动
    [80, 300, 800, 1500].forEach(ms => setTimeout(pan.apply, ms));
    spin.remove();
  } catch (e) {
    spin.remove();
    console.error('[splat-viewer] 加载失败', e);
    const m = String((e && e.message) || e);
    showMsg('加载失败：' + m + ' ｜ 检查文件名是否带扩展名、路径是否为 ' + MODEL_BASE + modelName);
  }
}

if (!modelName) {
  showMsg('缺少参数。用法：view.html?model=文件名.spz');
} else {
  boot();

  // 尺寸变化会让库重算投影矩阵、冲掉镜头偏移，这里补回来
  if (window.ResizeObserver) {
    let roTimer = null;
    new ResizeObserver(() => {
      clearTimeout(roTimer);
      roTimer = setTimeout(pan.apply, 60);
    }).observe(stageEl);
  }
}
</script>
</body>
</html>
