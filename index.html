<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>splat-viewer</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f25; --panel-2:#232730;
    --line:#2e333d; --text:#e6e9ef; --dim:#8d95a3; --accent:#4a9eff;
    --stage-bg:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; overflow:hidden;
  }

  /* 左侧列表 */
  aside{
    width:360px; flex:none; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    position:relative; z-index:2;    /* 盖住画布，模型拖过来也不越界 */
  }
  .head{padding:14px 16px 10px; border-bottom:1px solid var(--line)}
  .head h1{margin:0; font-size:15px; font-weight:600; letter-spacing:.3px}
  .head .sub{margin-top:3px; font-size:12px; color:var(--dim)}
  .tools{display:flex; gap:8px; margin-top:10px}
  .tools button{
    flex:1; background:var(--panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:6px;
    padding:5px 8px; font-size:12px; cursor:pointer;
  }
  .tools button:hover{border-color:var(--accent); color:#fff}
  .list{
    flex:1; overflow-y:auto; padding:10px;
    display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start;
  }
  .item{
    padding:6px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; background:var(--panel-2);
    transition:border-color .15s, background .15s;
  }
  .item:hover{border-color:#3a4150}
  .item.on{border-color:var(--accent); background:rgba(74,158,255,.12)}
  .item .thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
    border-radius:5px; background:#e9ecf1;
  }
  .item .thumb.blank{
    background:repeating-linear-gradient(45deg,#252a33 0 8px,#2b313b 8px 16px);
  }
  .item .n{
    font-size:13px; margin-top:6px; line-height:1.4;
    word-break:break-all; color:var(--text);
  }
  .item .tag{
    display:inline-block; font-size:9px; padding:0 4px; border-radius:3px;
    background:#2f3641; color:#9aa4b2; margin-left:4px; vertical-align:1px;
  }
  .empty{padding:24px 16px; color:var(--dim); font-size:13px; line-height:1.7}

  /* 右侧 */
  main{flex:1; display:flex; flex-direction:column; min-width:0}
  .bar{
    min-height:44px; flex:none; display:flex; align-items:center;
    padding:6px 16px; gap:14px; border-bottom:1px solid var(--line);
    background:var(--panel); flex-wrap:wrap;
    position:relative; z-index:2;    /* 同上，顶栏不被模型盖住 */
  }
  .bar .name{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:38%}
  .ctl{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim)}
  .ctl input[type=color]{
    width:26px; height:22px; padding:0; border:1px solid var(--line);
    border-radius:4px; background:none; cursor:pointer;
  }
  .ctl select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:3px 6px; font-size:12px; cursor:pointer;
  }
  .ctl button, .bar .right button{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:3px 9px; font-size:12px; cursor:pointer;
  }
  .ctl button:hover, .bar .right button:hover{border-color:var(--accent); color:#fff}
  .btn-ico{display:inline-flex; align-items:center; gap:5px}

  /* 右侧按钮组靠右对齐 */
  .bar .right{display:flex; gap:8px; margin-left:auto; flex:none; align-items:center}

  /* 状态文字不再显示；元素保留，避免各处赋值报错 */
  .bar .status{display:none}

  /* 折叠按钮 */
  .btn-fold{
    flex:none; width:28px; height:24px; padding:0;
    background:var(--panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:4px;
    font-size:13px; line-height:1; cursor:pointer;
  }
  .btn-fold:hover{border-color:var(--accent); color:#fff}
  body.folded aside{display:none}

  #stage{
    flex:1; position:relative; min-height:0;
    overflow:hidden;                 /* 拖动的渲染层不许溢出画布 */
    background-color:var(--stage-bg);
    background-size:cover; background-position:center; background-repeat:no-repeat;
    transition:background-color .15s;
  }
  #stage .host{position:absolute; inset:0}
  #stage .grid{
    position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .15s;
    background-image:
      linear-gradient(to right, rgba(0,0,0,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,.07) 1px, transparent 1px);
    background-size:48px 48px;
    background-position:center center;
  }
  #stage.grid-on .grid{opacity:1}
  .hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; color:var(--dim); font-size:13px; line-height:1.9;
    pointer-events:none;
  }
  .hint b{color:var(--text); font-weight:600}
  .spinner{
    position:absolute; left:50%; top:50%; width:28px; height:28px; margin:-14px 0 0 -14px;
    border:2px solid rgba(255,255,255,.15); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{
    position:absolute; left:16px; right:16px; bottom:16px;
    background:#3a1f22; border:1px solid #6a2f36; color:#ffb4bc;
    padding:10px 12px; border-radius:6px; font-size:12px; line-height:1.6;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "@mkkellogg/gaussian-splats-3d": "./vendor/gaussian-splats-3d.module.js"
  }
}
</script>
</head>
<body>

<aside>
  <div class="head">
    <h1>3D 高斯点云</h1>
    <div class="sub" id="count">正在扫描…</div>
    <div class="tools">
      <button id="refresh">重新扫描</button>
      <button id="reload">重新加载</button>
    </div>
  </div>
  <div class="list" id="list"></div>
</aside>

<main>
  <div class="bar">
    <button class="btn-fold" id="fold" title="折叠左侧面板">☰</button>

    <div class="name" id="cur">—</div>

    <div class="ctl">
      <span>底色</span>
      <input type="color" id="bg" value="#ffffff">
    </div>

    <div class="ctl">
      <span>上方向</span>
      <select id="up">
        <option value="0,-1,0" selected>Y 向下（3DGS 常规）</option>
        <option value="0,1,0">Y 向上</option>
        <option value="0,0,1">Z 向上</option>
        <option value="0,-1,-0.6">Y 向下 · 俯视 31°</option>
      </select>
    </div>

    <div class="ctl">
      <label style="cursor:pointer;display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="grid" checked> 网格
      </label>
    </div>

    <div class="ctl">
      <button id="wallpaper" title="上传一张图作为展示区背景（不保存，刷新即失效）">更换壁纸</button>
    </div>
    <input type="file" id="wallpaperFile" accept="image/*" hidden>

    <div class="status" id="status"></div>

    <div class="right">
      <button id="resetBg" title="清除壁纸，恢复纯底色">重置背景</button>
      <button id="autofit">重置视角</button>
      <button id="shot" class="btn-ico" title="把当前画面存成 JPG（含底色 / 壁纸、网格、模型）">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4.6" width="12" height="8.8" rx="1.8"/><circle cx="8" cy="9.1" r="2.5"/><path d="M5.8 4.6l1-1.8h2.4l1 1.8"/></svg><span class="btn-label">截屏保存</span>
      </button>
      <button id="link" class="btn-ico" title="复制纯展示页直链：只有模型，白底无 UI">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 9.8a2.6 2.6 0 0 1 0-3.7l1.4-1.4a2.6 2.6 0 0 1 3.7 3.7l-.7.7"/><path d="M9.8 6.2a2.6 2.6 0 0 1 0 3.7L8.4 11.3a2.6 2.6 0 0 1-3.7-3.7l.7-.7"/></svg><span class="btn-label">复制直链</span>
      </button>
    </div>
  </div>

  <div id="stage" class="grid-on">
    <div class="grid"></div>
    <div class="hint" id="hint">
      <b>从左边选一个模型</b><br>
      左键旋转 · 滚轮缩放 · Shift+左键 或 右键 平移
    </div>
  </div>
</main>

<script type="module">
import {
  FIT_SIZE, HOME_POS, createViewer, fitMesh, createPanController
} from './viewer-core.js';

const listEl   = document.getElementById('list');
const stageEl  = document.getElementById('stage');
const countEl  = document.getElementById('count');
const curEl    = document.getElementById('cur');
const statusEl = document.getElementById('status');
const hintEl   = document.getElementById('hint');
const bgEl     = document.getElementById('bg');
const upEl     = document.getElementById('up');
const gridEl   = document.getElementById('grid');

/* Idol 出的 ply 已在工作流里用 Transform Splat 绕 Y 轴 -90° 校正过，
   这里保持 0 即可。若哪天工作流去掉了那个节点，把这里改回 -90。 */
/* 模型归一化后的目标直径，以及配套的工作相机位置。
   两个值要一起看：改 FIT_SIZE 就得改 HOME_POS 的距离，否则画面大小会跳。 */
const YAW_DEG = 0;   // 模型朝向补转；取景常量在 viewer-core.js，两页共用

let viewer = null;
let splatMesh = null;
let current = null;
let itemsCache = [];

async function clearStage(){
  if (viewer) {
    const v = viewer;
    const renderer = v.__renderer;
    viewer = null; splatMesh = null;
    try { await v.dispose(); } catch(e){}
    // 外部传入的 renderer 库不会自己回收，必须手动释放，
    // 否则每换一个模型就漏一个 WebGL 上下文（浏览器上限约 16 个，超了直接崩）。
    if (renderer) {
      try { renderer.dispose(); } catch(e){}
      try { renderer.forceContextLoss(); } catch(e){}
    }
  }
  stageEl.querySelectorAll('.host').forEach(n => n.remove());
  stageEl.querySelectorAll('.err').forEach(n => n.remove());
}





/**
 * 把相机拉回默认机位，让画面回到"正对模型、大小合适"的状态。
 * 这个库没有公开的相机接口，只能直接改它内部的 camera / controls；
 * 拿不到就返回 false，不抛错打断主流程。
 */
function resetCamera(){
  if (!viewer) return false;
  try {
    const cam = viewer.camera;
    const ctl = viewer.controls;
    if (!cam || !cam.position) return false;
    const up = upEl.value.split(',').map(Number);
    cam.position.set(HOME_POS[0], HOME_POS[1], HOME_POS[2]);
    cam.up.set(up[0], up[1], up[2]);
    if (ctl && ctl.target) {
      ctl.target.set(0, 0, 0);
      if (typeof ctl.update === 'function') ctl.update();
    }
    if (typeof cam.lookAt === 'function') cam.lookAt(0, 0, 0);
    if (typeof cam.updateProjectionMatrix === 'function') cam.updateProjectionMatrix();
    return true;
  } catch (e) {
    console.warn('[splat-viewer] resetCamera 失败', e);
    return false;
  }
}

async function loadModel(item, el){
  if (current === item.name) return;
  current = item.name;
  pan.reset();                 // 换模型时位置偏移归零

  document.querySelectorAll('.item').forEach(x => x.classList.remove('on'));
  if (el) el.classList.add('on');

  curEl.textContent = item.name;
  statusEl.textContent = '加载中…';
  await clearStage();
  if (hintEl) hintEl.remove();

  const spin = document.createElement('div');
  spin.className = 'spinner';
  stageEl.appendChild(spin);

  const host = document.createElement('div');
  host.className = 'host';
  stageEl.appendChild(host);

  try {
    viewer = createViewer(host, {
      cameraUp: upEl.value.split(',').map(Number),
      position: HOME_POS,
    });

    await viewer.addSplatScene('models/' + encodeURIComponent(item.name), {
      splatAlphaRemovalThreshold: 5,
      showLoadingUI: false,
    });

    viewer.start();
    spin.remove();

    splatMesh = viewer.getSplatMesh();
    fitMesh(splatMesh, YAW_DEG);
    pan.apply();                // 新相机要重新套上偏移

  } catch (err) {
    console.error(err);
    spin.remove();
    statusEl.textContent = '失败';
    const m = String(err && err.message || err);
    const d = document.createElement('div');
    d.className = 'err';
    d.textContent = '加载失败：' + m + '（按 F12 看 Console）';
    stageEl.appendChild(d);
    current = null;
  }
}

function renderList(items){
  itemsCache = items;
  listEl.innerHTML = '';
  countEl.textContent = `共 ${items.length} 个模型`;

  if (!items.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = '模型目录里还没有文件。<br>跑一次图生 3D 后点「重新扫描」。';
    listEl.appendChild(d);
    return;
  }

  for (const it of items){
    const div = document.createElement('div');
    div.className = 'item';

    const img = document.createElement('img');
    img.className = 'thumb';
    img.alt = '';
    img.loading = 'lazy';
    if (it.thumb) {
      img.src = 'models/' + encodeURIComponent(it.thumb);
      img.addEventListener('error', () => { img.classList.add('blank'); img.removeAttribute('src'); });
    } else {
      img.classList.add('blank');
    }

    const n = document.createElement('div');
    n.className = 'n';
    // 文件名不显示扩展名 —— 右边已经有类型标签了
    n.textContent = it.name.replace(/\.[^.]+$/, '');
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = it.ext.toUpperCase();
    n.appendChild(tag);

    div.dataset.name = it.name;   // 用完整文件名定位，不依赖显示文本

    div.appendChild(img);
    div.appendChild(n);
    div.addEventListener('click', () => loadModel(it, div));
    if (it.name === current) div.classList.add('on');
    listEl.appendChild(div);
  }
}

async function scan(){
  countEl.textContent = '正在扫描…';
  try {
    const r = await fetch('index.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    renderList(await r.json());
  } catch (err) {
    countEl.textContent = '扫描失败';
    listEl.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '读不到 /index.json：' + err.message;
    listEl.appendChild(d);
  }
}

/* ---- 交互 ---- */
document.getElementById('refresh').addEventListener('click', scan);

document.getElementById('reload').addEventListener('click', () => {
  if (!current) return;
  const name = current;
  const item = itemsCache.find(x => x.name === name);
  if (!item) return;
  current = null;
  const el = [...document.querySelectorAll('.item')]
    .find(x => x.dataset.name === name);
  loadModel(item, el);
});

const autofitBtn = document.getElementById('autofit');
const AUTOFIT_LABEL = '重置视角';

function flashBtn(text){
  autofitBtn.textContent = text;
  clearTimeout(flashBtn._t);
  flashBtn._t = setTimeout(() => { autofitBtn.textContent = AUTOFIT_LABEL; }, 1400);
}

autofitBtn.addEventListener('click', () => {
  if (!splatMesh) {
    statusEl.textContent = '先选一个模型';
    flashBtn('先选模型');
    return;
  }
  const ok = fitMesh(splatMesh, YAW_DEG);
  pan.reset();                 // 画面偏移一起归零
  const camOk = resetCamera();
  if (ok) {
    flashBtn(camOk ? '✓ 已复位' : '模型已归位·视角未复位');
  } else {
    flashBtn('复位失败');
  }
});

bgEl.addEventListener('input', () => {
  stageEl.style.setProperty('--stage-bg', bgEl.value);
});
stageEl.style.setProperty('--stage-bg', bgEl.value);

/* ---- 壁纸：上传一张图铺在展示区背景 ----
   只在内存里用 objectURL，不写任何存储，刷新页面就没了。
   目的是方便「上传喜欢的壁纸 + 摆好模型」直接截图收藏。 */
const wallBtn     = document.getElementById('wallpaper');
const wallFile    = document.getElementById('wallpaperFile');
const resetBgBtn  = document.getElementById('resetBg');
let wallpaperURL  = null;

function clearWallpaper() {
  if (wallpaperURL) {
    URL.revokeObjectURL(wallpaperURL);   // 释放，避免内存泄漏
    wallpaperURL = null;
  }
  stageEl.style.backgroundImage = '';
}

wallBtn.addEventListener('click', () => wallFile.click());

wallFile.addEventListener('change', () => {
  const f = wallFile.files && wallFile.files[0];
  if (!f) return;
  clearWallpaper();
  wallpaperURL = URL.createObjectURL(f);
  stageEl.style.backgroundImage = `url("${wallpaperURL}")`;
  wallFile.value = '';   // 清空，否则选同一张不会再触发 change
});

resetBgBtn.addEventListener('click', () => {
  // 重置背景 = 清掉壁纸图 + 底色恢复默认白。两者都归位才算「重置」。
  const bgChanged = bgEl.value.toLowerCase() !== '#ffffff';
  const had = !!wallpaperURL || bgChanged;
  clearWallpaper();
  stageEl.style.setProperty('--stage-bg', '#ffffff');
  bgEl.value = '#ffffff';   // 同步颜色选择器，避免显示和实际不一致
  resetBgBtn.textContent = had ? '已重置' : '已是默认';
  clearTimeout(resetBgBtn._t);
  resetBgBtn._t = setTimeout(() => { resetBgBtn.textContent = '重置背景'; }, 1200);
});

/* ---- 画面内平移 ----
   逻辑收在 viewer-core.js 的 createPanController()，两个页面共用一份，
   以后调平移只改那里，不会再出现「改了一边忘另一边」。
   原理：相机和观察中心都不动，只给相机设「取景偏移」，
   所以旋转缩放始终绕模型自己转，也不会有透视变形。 */
const pan = createPanController(stageEl, () => viewer);

/* ---- 折叠左侧面板 ---- */
const foldBtn = document.getElementById('fold');
foldBtn.addEventListener('click', () => {
  const folded = document.body.classList.toggle('folded');
  foldBtn.textContent = folded ? '\u00bb' : '\u2630';
  foldBtn.title = folded ? '展开左侧面板' : '折叠左侧面板';
});

/**
 * 把当前外观与视角打包成查询参数，交给 view.html 还原。
 * 不传壁纸（本地文件无法塞进 URL）、不传网格（展示页始终无网格）。
 * 旋转角度和缩放不用单独传：它们已经包含在相机位置里。
 */
function buildShareQuery() {
  const q = new URLSearchParams();
  q.set('model', current);
  q.set('bg', bgEl.value.replace('#', ''));
  q.set('up', upEl.value);

  const cam = viewer && viewer.camera;
  if (cam && cam.position) {
    const f = v => {
      const n = Number(v);
      return Number.isFinite(n) ? Math.round(n * 1000) / 1000 : 0;
    };
    q.set('cam', [f(cam.position.x), f(cam.position.y), f(cam.position.z)].join(','));
  }

  // 画面偏移按「占画面宽高的百分比」传，换屏幕尺寸也能对上
  const p = pan.getPercent();
  if (p.x || p.y) q.set('pan', `${p.x.toFixed(1)},${p.y.toFixed(1)}`);
  return q;
}

/**
 * 把画布区当前的样子合成为一张图。
 *
 * 画布区其实是几层叠出来的，WebGL 只画了「模型」那一层：
 *   底色（CSS）→ 壁纸（CSS）→ 网格（CSS）→ 模型（WebGL canvas）
 * 所以不能直接截 canvas，得按这个顺序往离屏画布上重画一遍。
 */
async function captureStage() {
  const glCanvas = stageEl.querySelector('canvas');
  if (!glCanvas) throw new Error('画布还没准备好');

  const w = stageEl.clientWidth  || 1;
  const h = stageEl.clientHeight || 1;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // 封顶 2，避免出超大图

  const out = document.createElement('canvas');
  out.width  = Math.round(w * dpr);
  out.height = Math.round(h * dpr);
  const ctx = out.getContext('2d');
  ctx.scale(dpr, dpr);

  // 1) 底色
  ctx.fillStyle = bgEl.value;
  ctx.fillRect(0, 0, w, h);

  // 2) 壁纸，按 cover 铺满
  if (wallpaperURL) {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload  = () => res(im);
      im.onerror = () => rej(new Error('壁纸读取失败'));
      im.src = wallpaperURL;
    });
    const s  = Math.max(w / img.width, h / img.height);
    const dw = img.width * s, dh = img.height * s;
    ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }

  // 3) 网格，跟 CSS 一致：48px 一格、居中
  if (gridEl.checked) {
    const step = 48;
    const ox = ((w / 2) % step + step) % step;
    const oy = ((h / 2) % step + step) % step;
    ctx.strokeStyle = 'rgba(0,0,0,.07)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = ox; x < w; x += step) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); }
    for (let y = oy; y < h; y += step) { ctx.moveTo(0, y + .5); ctx.lineTo(w, y + .5); }
    ctx.stroke();
  }

  // 4) 模型层
  ctx.drawImage(glCanvas, 0, 0, w, h);

  return out;
}

const shotBtn = document.getElementById('shot');
const shotLabel = shotBtn.querySelector('.btn-label');
const SHOT_LABEL = '截屏保存';

function shotFlash(text) {
  shotLabel.textContent = text;
  clearTimeout(shotBtn._t);
  shotBtn._t = setTimeout(() => { shotLabel.textContent = SHOT_LABEL; }, 1600);
}

shotBtn.addEventListener('click', async () => {
  if (!splatMesh) { shotFlash('先选模型'); return; }

  shotLabel.textContent = '保存中…';
  try {
    const canvas = await captureStage();
    // 文件名带时间戳：同名模型连拍多次也不会互相覆盖
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const ts = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`
             + `-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    const name = (current || 'splat').replace(/\.[^.]+$/, '');
    canvas.toBlob(blob => {
      if (!blob) { shotFlash('失败'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${name}_${ts}.jpg`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      shotFlash('✓ 已保存');
    }, 'image/jpeg', 0.92);
  } catch (e) {
    console.error('[splat-viewer] 截图失败', e);
    shotFlash('失败');
  }
});

/* 复制纯展示页（view.html）的直链，方便分享单个模型。 */
const linkBtn = document.getElementById('link');
const linkLabel = linkBtn.querySelector('.btn-label');
const LINK_LABEL = '复制直链';

linkBtn.addEventListener('click', async () => {
  if (!current) {
    statusEl.textContent = '先选一个模型';
    linkLabel.textContent = '先选模型';
    clearTimeout(linkBtn._t);
    linkBtn._t = setTimeout(() => { linkLabel.textContent = LINK_LABEL; }, 1400);
    return;
  }
  const url = new URL('view.html?' + buildShareQuery().toString(), location.href).href;
  let ok = false;
  try {
    await navigator.clipboard.writeText(url);
    ok = true;
  } catch (e) {
    // 非 https 或浏览器拒绝时退化为手动复制
    window.prompt('复制这个链接：', url);
  }
  linkLabel.textContent = ok ? '✓ 已复制' : '已弹出';
  statusEl.textContent = url;
  clearTimeout(linkBtn._t);
  linkBtn._t = setTimeout(() => { linkLabel.textContent = LINK_LABEL; }, 1600);
});

gridEl.addEventListener('change', () => {
  stageEl.classList.toggle('grid-on', gridEl.checked);
});

upEl.addEventListener('change', () => {
  if (!current) return;
  const name = current;
  const item = itemsCache.find(x => x.name === name);
  if (!item) return;
  current = null;
  const el = [...document.querySelectorAll('.item')]
    .find(x => x.dataset.name === name);
  loadModel(item, el);
});

/* 容器尺寸一变，库会重算投影矩阵、把 viewOffset 冲掉，这里补回来 */
if (window.ResizeObserver) {
  let _roTimer = null;
  new ResizeObserver(() => {
    clearTimeout(_roTimer);
    _roTimer = setTimeout(pan.apply, 60);
  }).observe(stageEl);
}

scan();
</script>
